name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies & Build Web
        run: |
          npm install
          npm run build || echo "No build script, proceeding"

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Cordova for Android Packaging
        run: |
          npm install -g cordova
          cordova create myApp com.sadeq.excelapp ExcelApp
          cd myApp
          cordova platform add android

      - name: Build Debug APK
        run: |
          cd myApp
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-debug
          path: myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk

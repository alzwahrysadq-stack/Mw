name: Build Web to APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Build Web App
        run: |
          npm install
          npm run build || echo "Skipping build script"

      - name: Create Archive of Web Files
        run: |
          zip -r web-app.zip .

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v3
        with:
          name: web-files-package
          path: web-app.zip
